name: good_sleep_test
description: >-
  Flutter/FlutterFlow healthcare BLE plugin for Contec CMS50S SpO2 sleep
  tracking with dual spo2+wave CSV recording.
version: 0.1.2
homepage: https://github.com/VirtuousTechlogicMobile/good_sleep_test
repository: https://github.com/VirtuousTechlogicMobile/good_sleep_test
issue_tracker: https://github.com/VirtuousTechlogicMobile/good_sleep_test/issues

topics:
  - health
  - fitness
  - sleep-tracking
  - spo2
  - flutterflow

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.4
  permission_handler: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.goodslee.pco.good_sleep_test
        pluginClass: GoodSleepTestPlugin
      ios:
        pluginClass: GoodSleepTestPlugin
